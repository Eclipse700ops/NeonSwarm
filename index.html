<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Swarm</title>
<meta name="description" content="Neon Swarm: a fast neon survival shooter. Survive the swarm, level up and open crates.">
<meta name="theme-color" content="#090a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M90 50L14 82L34 50L14 18Z' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
:root{--bg:#e9e7f5;--ink:#12121c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#090a14;--ink:#eceaf6}}
:root[data-theme="dark"]{--bg:#090a14;--ink:#eceaf6}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none}
#g{position:relative;width:100%;height:100%;background:#090a14;overflow:hidden}
#g::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65))}
#c{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none;color:#eceaf6;z-index:2}
.xpb{position:absolute;left:0;right:0;top:0;height:8px;background:#ffffff14}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#a78bfa);box-shadow:0 0 14px #22d3ee}
#lv{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-weight:800;letter-spacing:3px;font-size:13px;color:#bae6fd}
.hp{position:absolute;left:12px;top:30px;width:min(240px,46vw);height:20px;border-radius:10px;background:#ffffff14;border:1px solid #ffffff2a;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#fb7185,#f43f5e);transition:width .15s}
.hp b{position:absolute;inset:0;text-align:center;font-size:12px;line-height:20px;font-weight:800}
.st{position:absolute;right:12px;top:24px;text-align:right;font-weight:800;font-size:24px;line-height:1.1;text-shadow:0 2px 10px #000}
.st small{display:block;font-size:14px;color:#fda4af}
#mu{position:absolute;left:12px;top:58px;pointer-events:auto;background:#ffffff14;border:1px solid #ffffff2a;border-radius:10px;color:#fff;padding:2px 9px;cursor:pointer;font-size:14px}
#dash{position:absolute;right:16px;bottom:22px;width:92px;height:92px;border-radius:50%;border:0;pointer-events:auto;cursor:pointer;color:#fff;font:800 15px 'Outfit',sans-serif;background:conic-gradient(#22d3ee var(--p,360deg),#ffffff1c 0);-webkit-tap-highlight-color:transparent}
#dash::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#0d0f22}
#dash span{position:relative;display:block;line-height:1.1}#dash small{display:block;font-size:10px;font-weight:400;opacity:.6}
#dash:active{transform:scale(.94)}
#toast{position:absolute;left:0;right:0;top:26%;text-align:center;font-weight:800;font-size:clamp(28px,6vw,54px);letter-spacing:6px;color:#fbbf24;text-shadow:0 0 24px #f59e0b;opacity:0}
#toast.on{animation:tt 1.8s ease-out}
@keyframes tt{0%{opacity:0;transform:scale(1.6)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#ov{position:absolute;inset:0;z-index:5;display:flex;padding:16px;background:rgba(6,7,16,.76);backdrop-filter:blur(8px);color:#eceaf6;overflow:auto}
#ov[hidden]{display:none}
.box{margin:auto;max-width:560px;width:100%;text-align:center;background:linear-gradient(160deg,#1b1d3a,#10111f);border:1px solid #ffffff22;border-radius:24px;padding:26px 20px;box-shadow:0 30px 80px #000a,0 0 60px #22d3ee22}
.box.wide{max-width:880px;position:relative}.box.xl{max-width:1040px}
.box h1{margin:0;font-size:clamp(38px,9vw,62px);font-weight:800;letter-spacing:-1px;line-height:1}
.box h1 span{background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.box h2{margin:0 0 4px;font-size:30px}.box h3{margin:18px 0 0;font-size:16px}
.box p{color:#a5a3bd;margin:10px 0}
.box small,.note{color:#a5a3bd;font-size:12px}
.keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0}
.keys span{background:#ffffff10;border:1px solid #ffffff1c;border-radius:10px;padding:6px 12px;font-size:13px}
.btn{font:800 17px 'Outfit',sans-serif;border:0;border-radius:14px;padding:14px 30px;color:#fff;cursor:pointer;background:linear-gradient(90deg,#06b6d4,#8b5cf6);box-shadow:0 8px 28px #7c5cff66;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}
.btn.alt{background:transparent;border:1.5px solid #ffffff33;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}.row .btn{flex:1;padding:12px 10px;font-size:15px}
.stats{display:flex;justify-content:center;gap:22px;margin:16px 0}.stats b{display:block;font-size:28px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-top:16px}
.card{position:relative;font:inherit;color:#eceaf6;text-align:center;background:linear-gradient(170deg,#262a52,#14152a);border:1.5px solid #8b5cf6aa;border-radius:18px;padding:18px 10px;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-4px);border-color:#22d3ee;box-shadow:0 0 30px #22d3ee55}
.card .ic{display:block;font-size:40px;margin-bottom:6px}.card b{display:block;font-size:17px}.card small{display:block;margin:4px 0 8px;font-size:13px}
.card em{font-style:normal;color:#67e8f9;font-size:12px;font-weight:600}.card kbd{position:absolute;top:8px;left:10px;font-size:11px;color:#777a9c}
.bal{display:inline-block;background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:6px 16px;font-weight:800;margin:6px 0 14px}
.cr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));text-align:left}
.crt{border:1px solid #ffffff22;border-radius:18px;padding:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 16%,#14152a),#10111f)}
.crt .top{display:flex;gap:12px;align-items:center}.crt svg{width:92px;flex:none;filter:drop-shadow(0 0 14px var(--cc));animation:flo 3s ease-in-out infinite}.crt h3{margin:0;font-size:18px}
.od{margin:10px 0}.od div{display:grid;grid-template-columns:10px 78px 1fr 44px;gap:6px;align-items:center;font-size:13px;padding:2px 0}
.od i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.od u{height:5px;border-radius:3px;background:#ffffff18;position:relative;overflow:hidden}.od u::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c)}
.od span:last-child{text-align:right;font-weight:700}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin:12px 0 18px}
.sl{--rc:#888;position:relative;border-radius:14px;padding:8px 4px;border:1.5px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 26%,#14152a),#14152a);font-size:12px;line-height:1.2}
.sl svg{width:50px;height:50px;filter:drop-shadow(0 0 8px var(--rc))}.sl small{display:block}
.sl.off{opacity:.35;filter:grayscale(1);border-style:dashed;background:none}
.sl em{position:absolute;top:4px;right:6px;font-style:normal;font-size:11px;font-weight:800;background:var(--rc);color:#111;border-radius:8px;padding:0 6px}
.rg{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:8px 0 18px}
.rc{--rc:#888;width:136px;border-radius:16px;padding:12px 8px;border:2px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 35%,#14152a),#14152a);box-shadow:0 0 26px -4px var(--rc);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*90ms)}
.rc svg{width:92px}.rc b{display:block;font-size:14px}.rc small{color:var(--rc);font-weight:600;text-transform:uppercase;letter-spacing:1px}.rc em{display:block;font-style:normal;font-size:11px;color:#cbd5e1}
.sk{width:150px;margin:0 auto;animation:shake .9s ease-in-out}.sk svg{width:100%;filter:drop-shadow(0 0 30px #a78bfa)}
@keyframes gl{50%{filter:drop-shadow(0 0 36px #22d3eeaa)}}
@keyframes flo{50%{transform:translateY(-5px)}}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg) scale(1.05)}30%{transform:rotate(9deg) scale(1.1)}45%{transform:rotate(-8deg) scale(1.15)}60%{transform:rotate(8deg) scale(1.2)}85%{transform:scale(1.35);filter:brightness(2)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.cr{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.crt .top svg{width:64px}.crt h3{font-size:17px}.od{margin:6px 0}.od div{font-size:12px;padding:1px 0}.crt>small{display:block;font-size:11px;line-height:1.35}.crt .row .btn{font-size:14px}
.lzn{display:block;margin-top:6px;color:#cbd5e1}
.eqb{margin-top:6px;font:700 11px 'Outfit',sans-serif;border:1px solid #ffffff33;background:#ffffff12;color:#fff;border-radius:8px;padding:3px 10px;cursor:pointer}
.eqb:disabled{background:var(--rc);color:#111;border-color:transparent;cursor:default}
.kpb{position:absolute;top:12px;right:12px;z-index:4;width:40px;height:40px;border-radius:12px;border:1px solid #ffffff2a;background:#ffffff12;font-size:18px;cursor:pointer}
.kp{display:none;position:absolute;top:58px;right:12px;z-index:4;width:188px;padding:10px;border-radius:14px;background:#0b0c1af2;border:1px solid #ffffff2a;box-shadow:0 10px 40px #000a}.kp.on{display:block}
.kpd{min-height:30px;line-height:17px;padding:6px 8px;box-sizing:border-box;margin-bottom:8px;border-radius:8px;background:#ffffff0f;font:800 13px 'Outfit',sans-serif;letter-spacing:2px;overflow-wrap:anywhere}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kpg button{font:800 16px 'Outfit',sans-serif;color:#fff;border:1px solid #ffffff22;background:#ffffff12;border-radius:8px;padding:8px 0;cursor:pointer}.kpg button:hover{background:#ffffff26}
#obj{position:absolute;right:12px;top:78px;text-align:right;font-weight:800;font-size:13px;letter-spacing:1px;text-shadow:0 2px 8px #000}
.eg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:12px 0}
.ec{background:#ffffff0a;border:1px solid #ffffff1a;border-top:3px solid var(--ec);border-radius:14px;padding:8px;text-align:left}
.ec canvas{width:100%;height:auto;border-radius:10px;display:block}
.ec b{display:block;margin-top:6px;font-size:15px;color:var(--ec)}.ec small{display:block;font-size:11.5px;color:#cbd5e1;line-height:1.35;margin-top:2px}.ec .ap{color:#fbbf24}

#abilities{position:absolute;left:12px;top:88px;width:min(220px,42vw);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;pointer-events:auto}
.ab{min-height:48px;border:1px solid #ffffff30;border-radius:9px;background:#101329dd;color:#dce5ff;font:700 11px 'Outfit',sans-serif;padding:4px 3px;cursor:pointer;text-align:center;box-shadow:0 3px 12px #0005}
.ab strong{display:block;font-size:14px;color:#67e8f9}.ab small{display:block;color:#a5a3bd;font-size:9px}
.ab.sel{border-color:#22d3ee;background:linear-gradient(145deg,#16445aee,#31245fee);box-shadow:0 0 14px #22d3ee55}
.ab.max{opacity:.35;cursor:not-allowed}.ab.wait{border-style:dashed}
.armtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:14px 0 18px}
.armtabs button{font:700 14px 'Outfit',sans-serif;color:#cbd5e1;background:#ffffff0c;border:1px solid #ffffff26;border-radius:11px;padding:10px 20px;cursor:pointer}
.armtabs button.on{color:white;border-color:#22d3ee;background:linear-gradient(100deg,#0891b2,#6d4bd1);box-shadow:0 0 18px #22d3ee33}
.armsection{animation:fadein .2s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.box{border-color:#ffffff2b;box-shadow:0 28px 90px #000b,0 0 0 1px #22d3ee0c,0 0 55px #22d3ee1c}
@media(max-width:600px){#abilities{width:168px;grid-template-columns:repeat(3,minmax(0,1fr));top:84px}.ab{min-height:42px}}
.ec{position:relative;overflow:hidden;animation:ecin .55s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*70ms);transition:box-shadow .2s}
.ec::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#ffffff1c,transparent);transform:skewX(-20deg);animation:ecs 5s ease-in-out infinite;animation-delay:calc(var(--i)*.45s);pointer-events:none}
.ec:hover{box-shadow:0 0 28px -4px var(--ec)}
@keyframes ecin{from{opacity:0;transform:translateY(18px) scale(.85)}}
@keyframes ecs{0%,60%{left:-60%}100%{left:130%}}
.kbar{height:8px;border-radius:5px;background:#ffffff18;overflow:hidden;margin:4px auto 6px;max-width:420px}.kbar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#a78bfa)}

/* ---------- title + main menu ---------- */
#ov:has(.mnu,.ttl){background:rgba(6,7,16,.3);backdrop-filter:none}
.logo{margin:0;font-weight:800;letter-spacing:-2px;line-height:.95;text-shadow:0 0 50px #22d3ee55}
.logo span{background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #a78bfa99);animation:gl 3s ease-in-out infinite}
.tag{letter-spacing:7px;text-transform:uppercase;font-size:12px;color:#b6b4d0;margin-top:10px;text-shadow:0 2px 10px #000}
.mnu{margin:auto;width:100%;max-width:1020px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;padding:4px 0}
.mh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.mh .logo{font-size:clamp(40px,6.6vw,72px)}
.who,.hints{display:flex;flex-wrap:wrap;gap:8px}.hints{justify-content:center}
.who span,.hints span{background:#0b0c18bb;border:1px solid #ffffff1f;border-radius:999px;padding:6px 14px;font-size:13px;color:#d6d4ec;backdrop-filter:blur(8px)}
.mg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.pn{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:22px;background:#0b0c18c9;border:1px solid #ffffff22;backdrop-filter:blur(10px);box-shadow:0 20px 60px #0009;text-align:left;min-width:0}
.pn h3{margin:0;font-size:19px}.pn .sub{display:block;margin-top:2px;color:#a5a3bd;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:5px;border-radius:14px;background:#ffffff0d}
.seg button{font:700 14px 'Outfit',sans-serif;color:#cbd5e1;background:none;border:0;border-radius:10px;padding:10px 4px;cursor:pointer;transition:.15s}
.seg button:hover{background:#ffffff14}.seg button.on{color:#fff;background:linear-gradient(90deg,#06b6d4,#8b5cf6);box-shadow:0 4px 16px #7c5cff55}
.mdd{margin:0;min-height:3.9em;font-size:13.5px;line-height:1.45;color:#b9b7d3}
.btn.big{width:100%;font-size:22px;letter-spacing:3px;padding:16px;box-shadow:0 0 40px #7c5cffaa}
.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:14px;border:1px solid #ffffff26;background:#ffffff0e;color:#fff;font:700 14px 'Outfit',sans-serif;cursor:pointer;transition:.15s}
.nav button:hover{background:#ffffff1c;border-color:#22d3ee;transform:translateY(-2px)}
.nav i{font-style:normal;font-size:24px;line-height:1.15}.nav small{min-height:13px;font-size:11px;font-weight:600;color:#67e8f9}
.lbh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.lbt{display:flex;gap:6px}.lbt button{font:700 13px 'Outfit',sans-serif;color:#cbd5e1;background:#ffffff0c;border:1px solid #ffffff26;border-radius:999px;padding:5px 14px;cursor:pointer}.lbt button.on{color:#fff;border-color:#22d3ee;background:linear-gradient(100deg,#0891b2,#6d4bd1)}
.lb ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.lb li{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:10px;background:#ffffff0d;font-size:14px}
.lb li i{font-style:normal;color:#a5a3bd;font-weight:800;text-align:center}.lb li.top i{color:#fbbf24}
.lb li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li b{color:#fcd34d;font-weight:800;white-space:nowrap;min-width:62px;text-align:right}
.lb li em{font-style:normal;color:#a5a3bd;font-size:12px;white-space:nowrap;min-width:78px;text-align:right}
.lb li.hd{background:none;padding-top:0;padding-bottom:0;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#8886a6}.lb li.hd b{color:inherit;font-weight:700}
.lb li.me{outline:1px solid #22d3ee}.lb li.nil{display:block;text-align:center;color:#a5a3bd;background:none}
.lb small{color:#8886a6;font-size:12px;margin-top:auto}
.lb li{position:relative}.lb li.in{animation:lbIn .55s cubic-bezier(.2,.9,.3,1.2)}.lb li.up{animation:lbUp 1.6s ease-out}.lb li.out{transition:opacity .35s,transform .35s;opacity:0;transform:translateX(26px)}
@keyframes lbIn{from{opacity:0;transform:translateX(-28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes lbUp{0%{background:#22d3ee55;box-shadow:0 0 18px #22d3ee99}100%{background:#ffffff0d;box-shadow:0 0 0 #0000}}
.lb li b.tick,.lb li em.tick{animation:lbTick .7s ease-out}@keyframes lbTick{35%{transform:scale(1.3);color:#fff}}
.lb small .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34d399;margin-right:6px;animation:lbPulse 1.6s infinite}@keyframes lbPulse{50%{opacity:.25}}
.ttl{margin:auto;width:100%;max-width:460px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.ttl .logo{font-size:clamp(54px,15vw,104px)}
.nc{width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:22px;background:#0b0c18d0;border:1px solid #ffffff24;backdrop-filter:blur(10px);box-shadow:0 20px 60px #0009}
.nc label{text-align:left;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#a5a3bd;font-weight:700}
.nc input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1.5px solid #ffffff2a;background:#ffffff0f;color:#fff;outline:0;text-align:center;font:700 20px 'Outfit',sans-serif;-webkit-user-select:text;user-select:text}
.nc input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px #22d3ee22}.nc input[readonly]{border-style:dashed;opacity:.85}
.disc{margin:0;padding:9px 12px;border-radius:10px;text-align:left;font-size:13px;line-height:1.4;color:#fde68a;background:#fbbf2414;border:1px solid #fbbf2455}
.nerr{min-height:16px;font-size:13px;color:#fda4af}
@media(max-width:820px){.mg{grid-template-columns:minmax(0,1fr)}.mh{justify-content:center;text-align:center}.who{justify-content:center}.tag{letter-spacing:5px}}
@media(max-width:420px){.lb li{gap:6px;padding:6px 8px}.lb li b{min-width:48px}.lb li em{min-width:60px}}

/* admin panel */
.adm h2{margin:0 0 4px}.adin{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid #ffffff2a;background:#ffffff0f;color:#fff;font:600 16px 'Outfit',sans-serif;margin:12px 0 4px;text-align:center}
.adl{display:grid;gap:6px;margin:10px 0;max-height:34vh;overflow:auto;text-align:left}
.adp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:9px 12px;border-radius:12px;border:1px solid #ffffff1f;background:#ffffff0d;color:#fff;font:700 14px 'Outfit',sans-serif;cursor:pointer;text-align:left}
.adp.on{outline:2px solid #22d3ee;background:#22d3ee1a}.adp b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adp small{grid-column:1/-1}
.adp .st{font-size:11px;padding:2px 8px;border-radius:999px;background:#ffffff14;color:#a5a3bd}.adp .st.play{background:#34d39922;color:#6ee7b7}
.adev{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-top:10px}.adev .btn{padding:12px 8px;font-size:14px}.adev .btn[disabled]{opacity:.35;cursor:not-allowed}
.admsg{min-height:18px;margin:8px 0 2px;font-size:13px;color:#a5a3bd}

 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){}}if(AC&&AC.state!='running')AC.resume()}

const SFX={

 if(k=='menu'){if(p==0)c.forEach(n=>mt(T,hz(n),sd*16,'triangle',.06,sd*6));if(p==0||p==8)mt(T,hz(r),sd*7,'sine',.2,.02);if(p%2==0)mt(T,hz(c[[0,1,2,1,0,2,1,2][p>>1]]+12),sd*5,'triangle',.07,.01)}
